<script>


  function wait(ms) { // make wait function for when processing bf to have delay
    return new Promise(resolve => setTimeout(resolve,ms));
  }


  function StartRun() {
    
    let CellLen = 16
    for (let i = 1; i < CellLen+1; i++) { // Reset all 16 "Visuliser Cells" to display 0
      document.getElementById(i).textContent = 0;
      document.getElementById(i).style.backgroundColor = "rgb(15,45,90)";
    }


    let code = document.getElementById("BFinput").value;
    let Delay = document.getElementById("Delay").value;
    let OldCell = 1;
    let CurrentCell = 1;
    document.getElementById(1).style.backgroundColor = "rgb(0,114,143)";
    document.getElementById("BFoutput").textContent =""


    async function ProcessBF() {

      for (let i = 0; i < code.length; i++) { 

        // Done + -><
        // Need to do  ., []

        await wait(Delay); // wait delay +0.25 ms


        if (code[i] == "+" && document.getElementById(CurrentCell).textContent<256){ // code for + to add 1 to current cell
          document.getElementById(CurrentCell).textContent = Number(document.getElementById(CurrentCell).textContent) + 1
        };

        if (code[i] == "+" && document.getElementById(CurrentCell).textContent>255){ // code for + to set current cell to 0 if cell is at 255 and its +
          document.getElementById(CurrentCell).textContent = document.getElementById(CurrentCell).textContent = 0
        };


        if (code[i] == "-" && document.getElementById(CurrentCell).textContent>0){ // code to take away one when -
          document.getElementById(CurrentCell).textContent = Number(document.getElementById(CurrentCell).textContent) - 1
        };

        if (code[i] == "-" && document.getElementById(CurrentCell).textContent==0){ // code to set to 255 when 0 and its -
          document.getElementById(CurrentCell).textContent = document.getElementById(CurrentCell).textContent = 255
        };


        if (code[i] == ">" && CurrentCell != 16){
          OldCell = CurrentCell;
          CurrentCell = CurrentCell+1;
          document.getElementById(OldCell).style.backgroundColor = "rgb(15,45,90)";
          document.getElementById(CurrentCell).style.backgroundColor = "rgb(0,114,143)";
        }
        else if (code[i] == ">" && CurrentCell == 16){
          OldCell = CurrentCell;
          CurrentCell = 1;
          document.getElementById(OldCell).style.backgroundColor = "rgb(15,45,90)";
          document.getElementById(CurrentCell).style.backgroundColor = "rgb(0,114,143)";
        };


        if (code[i] == "<" && CurrentCell != 1){
          OldCell = CurrentCell;
          CurrentCell = CurrentCell-1;
          document.getElementById(OldCell).style.backgroundColor = "rgb(15,45,90)";
          document.getElementById(CurrentCell).style.backgroundColor = "rgb(0,114,143)";
        }
        else if (code[i] == "<" && CurrentCell == 1){
          OldCell = CurrentCell;
          CurrentCell = 16;
          document.getElementById(OldCell).style.backgroundColor = "rgb(15,45,90)";
          document.getElementById(CurrentCell).style.backgroundColor = "rgb(0,114,143)";
        };


        if (code[i] == "."){
          let CellVal = document.getElementById(CurrentCell).textContent
          document.getElementById("BFoutput").textContent = String.fromCharCode(CellVal)
        };


      }

    }

    ProcessBF();

  }

</script>
